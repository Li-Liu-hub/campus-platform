spring:
  datasource:
    url: jdbc:mysql://localhost:3306/campushub?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      username: ${REDIS_USERNAME:root}
      password: ${REDIS_PASSWORD:123456}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
      connect-timeout: 3s
      lettuce:
        pool:
          # 最大连接数：并发上限，压测出现借取超时时优先调大
          max-active: 192
          # 空闲上限：压测结束后归还多余连接
          max-idle: 64
          # 保底空闲：避免冷启动时瞬时建连
          min-idle: 4
          # 借不到连接最多等 100ms，快速失败不在线程上堆积
          max-wait: 100ms
          # 空闲连接逐出检查周期
          time-between-eviction-runs: 30s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:root}
    password: ${RABBITMQ_PASSWORD:123456}
    virtual-host: ${RABBITMQ_VHOST:/}

server:
  tomcat:
    # 指定 Tomcat 工作目录为进程启动目录，否则 access log 会落盘到系统临时目录
    basedir: .
    accesslog:
      enabled: true
      directory: logs
      prefix: access_log
      file-date-format: .yyyy-MM-dd
      suffix: .log
      pattern: "%t %r %s %Dms"
