spring:
  # 调度线程池扩容：默认单线程时，浏览量刷库等长任务会饿死发件箱中继（5s 轮询）
  task:
    scheduling:
      pool:
        size: 4
  servlet:
    multipart:
      # 图片上传上限：单文件 5MB、单请求 10MB
      max-file-size: 5MB
      max-request-size: 10MB
  datasource:
    # 端口 3307 对应 docker-compose 里 mysql 的 "3307:3306" 映射——刻意避开本机可能已有的 3306 MySQL，
    # 改动 compose 的 CAMPUSHUB_MYSQL_PORT 时这里要同步；需要连别的库用 DB_URL 覆盖
    # allowPublicKeyRetrieval=true：MySQL 8 默认 caching_sha2_password，在 useSSL=false 时
    # 必须显式允许明文取公钥，否则 JDBC 报 "Public Key Retrieval is not allowed"（与 prod 配置保持一致）
    url: ${DB_URL:jdbc:mysql://localhost:3307/campushub?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      username: ${REDIS_USERNAME:root}
      password: ${REDIS_PASSWORD:123456}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
      connect-timeout: 3s
      lettuce:
        pool:
          # 最大连接数：并发上限，压测出现借取超时时优先调大
          max-active: 192
          # 空闲上限：压测结束后归还多余连接
          max-idle: 64
          # 保底空闲：避免冷启动时瞬时建连
          min-idle: 4
          # 借不到连接最多等 100ms，快速失败不在线程上堆积
          max-wait: 100ms
          # 空闲连接逐出检查周期
          time-between-eviction-runs: 30s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:root}
    password: ${RABBITMQ_PASSWORD:123456}
    virtual-host: ${RABBITMQ_VHOST:/}
    # 生产者确认（correlated）：broker 收到并持久化消息后异步回执，nack 时回调记录业务标识
    publisher-confirm-type: correlated
    # 路由不到任何队列时退回消息，触发 ReturnsCallback（几乎必然是配置错误，报警级别）
    publisher-returns: true
    # 退回的前提：路由失败的消息不静默丢弃而是交还生产者
    template:
      mandatory: true
    listener:
      simple:
        # AUTO 确认：方法正常返回自动 ACK，抛出异常自动 NACK 进入本地重试
        acknowledge-mode: auto
        # 本地重试耗尽后拒绝且不重回队列，经死信路由进入 DLQ 人工处理
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2

server:
  tomcat:
    # 指定 Tomcat 工作目录为进程启动目录，否则 access log 会落盘到系统临时目录
    basedir: .
    accesslog:
      enabled: true
      directory: logs
      prefix: access_log
      file-date-format: .yyyy-MM-dd
      suffix: .log
      pattern: "%t %r %s %Dms"

campushub:
  storage:
    # 存储后端：local=本地磁盘（默认）；oss=阿里云 OSS（凭据必须经环境变量注入，严禁写入本文件）
    type: ${STORAGE_TYPE:local}
    local:
      # 图片本地存储根目录（type=local 时生效）
      root-dir: ${STORAGE_ROOT_DIR:./uploads}
      # 图片访问 URL 前缀，由 web 层静态资源映射承接
      url-prefix: /files
    oss:
      # 阿里云 OSS：凭据经 ALIYUN_OSS_* 环境变量注入（存放于不入库的本地启动脚本），本文件只留占位符
      endpoint: ${ALIYUN_OSS_ENDPOINT:}
      bucket: ${ALIYUN_OSS_BUCKET:}
      access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
      access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
      # 访问前缀：留空时默认 https://{bucket}.{endpoint}；绑定自定义域名/CDN 时在此覆盖
      url-prefix: ${ALIYUN_OSS_URL_PREFIX:}
  shop:
    # 待付款购买记录的存活时长（分钟）：超时后由定时任务关闭并把冻结库存回补到可卖量。
    # 本地验证该功能时可临时调成 5，不用等满 15 分钟。
    order-timeout-minutes: 15
    # 超时扫描单批最多处理的记录数，避免一次锁定过多行
    timeout-batch-size: 200
    # 超时扫描间隔（毫秒），默认 60 秒
    timeout-scan-interval-ms: 60000

