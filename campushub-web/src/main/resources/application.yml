spring:
  application:
    name: campushub
  profiles:
    active: dev

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080
  tomcat:
    basedir: tomcat
    accesslog:
      enabled: true
      directory: logs
      prefix: access_log
      suffix: .log
      # 关闭缓冲，每条请求立即写入文件
      buffered: false
      # %D 记录请求处理耗时，本 Tomcat 版本（10.1.x）数值单位为微秒，除以 1000 即毫秒
      pattern: '%h %l %u %t "%r" %s %b %D'

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  max-login-count: 3
  overflow-logout-mode: REPLACED
  is-read-header: true
  is-write-header: true
  token-style: uuid
  is-log: true
