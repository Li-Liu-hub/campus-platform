spring:
  # 调度线程池扩容：默认单线程时，浏览量刷库等长任务会饿死发件箱中继（5s 轮询）
  task:
    scheduling:
      pool:
        size: 4
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql:3306/campushub?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:root}
      password: ${REDIS_PASSWORD:123456}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
      connect-timeout: 3s
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:root}
    password: ${RABBITMQ_PASSWORD:123456}
    virtual-host: ${RABBITMQ_VHOST:/}
    # 生产者确认（correlated）：broker 收到并持久化消息后异步回执，nack 时回调记录业务标识
    publisher-confirm-type: correlated
    # 路由不到任何队列时退回消息，触发 ReturnsCallback（几乎必然是配置错误，报警级别）
    publisher-returns: true
    # 退回的前提：路由失败的消息不静默丢弃而是交还生产者
    template:
      mandatory: true
    listener:
      simple:
        # AUTO 确认：方法正常返回自动 ACK，抛出异常自动 NACK 进入本地重试
        acknowledge-mode: auto
        # 本地重试耗尽后拒绝且不重回队列，经死信路由进入 DLQ 人工处理
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2

campushub:
  storage:
    oss:
      # 阿里云 OSS（唯一存储后端）：凭据经 ALIYUN_OSS_* 环境变量注入（存放于不入库的本地启动脚本），本文件只留占位符
      endpoint: ${ALIYUN_OSS_ENDPOINT:}
      bucket: ${ALIYUN_OSS_BUCKET:}
      access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
      access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
      # 访问前缀：留空时默认 https://{bucket}.{endpoint}；绑定自定义域名/CDN 时在此覆盖
      url-prefix: ${ALIYUN_OSS_URL_PREFIX:}
      # 前端直传凭证有效期（秒）：短有效期缩小凭证被滥用的窗口
      upload-credential-expire-seconds: ${ALIYUN_OSS_CREDENTIAL_EXPIRE_SECONDS:60}
  shop:
    # 待付款购买记录的存活时长（分钟）：超时后由定时任务关闭并把冻结库存回补到可卖量
    order-timeout-minutes: ${SHOP_ORDER_TIMEOUT_MINUTES:15}
    # 超时扫描单批最多处理的记录数
    timeout-batch-size: ${SHOP_TIMEOUT_BATCH_SIZE:200}
    # 超时扫描间隔（毫秒）
    timeout-scan-interval-ms: ${SHOP_TIMEOUT_SCAN_INTERVAL_MS:60000}
