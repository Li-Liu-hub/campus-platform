spring:
  # 调度线程池扩容：默认单线程时，浏览量刷库等长任务会饿死发件箱中继（5s 轮询）
  task:
    scheduling:
      pool:
        size: 4
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql:3306/campushub?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:root}
      password: ${REDIS_PASSWORD:123456}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
      connect-timeout: 3s
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:root}
    password: ${RABBITMQ_PASSWORD:123456}
    virtual-host: ${RABBITMQ_VHOST:/}
    # 生产者确认（correlated）：broker 收到并持久化消息后异步回执，nack 时回调记录业务标识
    publisher-confirm-type: correlated
    # 路由不到任何队列时退回消息，触发 ReturnsCallback（几乎必然是配置错误，报警级别）
    publisher-returns: true
    # 退回的前提：路由失败的消息不静默丢弃而是交还生产者
    template:
      mandatory: true
    listener:
      simple:
        # AUTO 确认：方法正常返回自动 ACK，抛出异常自动 NACK 进入本地重试
        acknowledge-mode: auto
        # 本地重试耗尽后拒绝且不重回队列，经死信路由进入 DLQ 人工处理
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
